<app-note-form 
  [note]="data.note" 
  (onNoteInputChange)="handleEditNote($event)"
  [focusNoteContentInput]="true"
></app-note-form>
@if(data.note.labels; as labels) {
  <app-labels-stack 
    (onRemoveLabel)="handleEditNote($event)" 
    [labels]="labels"
  ></app-labels-stack>
}
<div class="labels-and-date-edited">
  <div>Labels...</div>
  <span class="spacer"></span>
  <span class="edited-date">Edited</span>
</div>
<app-note-actions>
  <app-delete-note-action 
    [note]="data.note"
    deleteDialogMessage="Move to trash?"
    (onDeleteNote)="handleDoneEditing()"
  ></app-delete-note-action>
  <button mat-icon-button>
    <mat-icon class="material-symbols-outlined">palette</mat-icon>
  </button>
  <app-note-manage-labels-action 
    [note]="data.note"
    (onNoteLabelsInputChange)="handleEditNote($event)"
  ></app-note-manage-labels-action>
  <button mat-icon-button>
    <mat-icon class="material-symbols-outlined">content_copy</mat-icon>
  </button>
  <button align-end mat-button (click)="handleDoneEditing()">Done</button>
</app-note-actions>
