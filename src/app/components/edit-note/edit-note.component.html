<div class="note-form" [formGroup]="noteForm">
  <div>
    @if(!noteForm.controls.title.value){
      <div class="placeholder">Title</div>
    }
    <div
      (keydown)="checkKey($event)"
      #titleInput
      aria-multiline="false"
      formControlName="title"
      class="textarea"
      id="input-title"
      role="textbox"
      spellcheck="false"
      contenteditable
    ></div>
  </div>
  <div>
    @if(!noteForm.controls.content.value){
      <div class="placeholder">Note</div>
    }
    <div
      #noteContent
      aria-multiline="true"
      formControlName="content"
      class="textarea"
      id="input-content"
      role="textbox"
      spellcheck="false"
      contenteditable
    ></div>
  </div>
</div>
<div class="labels-and-date-edited">
  <div>Labels...</div>
  <span class="spacer"></span>
  <span class="edited-date">Edited</span>
</div>
<div class="edit-note-actions">
  <button mat-icon-button>
    <mat-icon class="material-symbols-outlined">delete</mat-icon>
  </button>
  <button mat-icon-button>
    <mat-icon class="material-symbols-outlined">palette</mat-icon>
  </button>
  <button mat-icon-button>
    <!-- Maybe use normal label icon -->
    <mat-icon class="material-symbols-outlined">new_label</mat-icon>
  </button>
  <button mat-icon-button>
    <mat-icon class="material-symbols-outlined">content_copy</mat-icon>
  </button>
  <span class="spacer"></span>
  <button mat-button (click)="handleDoneEditing()">Done</button>
</div>
