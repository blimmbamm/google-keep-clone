<button mat-icon-button (click)="handleDeleteNote($event)">
  <mat-icon class="material-symbols-outlined">delete</mat-icon>
</button>

<ng-template #deleteDialog>
  <div class="delete-dialog">
    <p>{{deleteDialogMessage()}}</p>
    <div class="delete-dialog-actions">
      <button mat-button (click)="deleteDialogRef?.close()">Cancel</button>
      <button mat-flat-button (click)="handleConfirmDeletion()">Yes</button>
    </div>
  </div>
</ng-template>
