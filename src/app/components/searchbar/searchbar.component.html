<button 
  mat-icon-button 
  (mousedown)="focusInput($event)"
>
  <mat-icon>search</mat-icon>
</button>
<input #searchInput [placeholder]="inputFocussed()? 'Search not implemented (yet) :)' : 'Search' " />
<button 
  [class.hidden]="!inputFocussed()" 
  mat-icon-button 
  (mousedown)="clearInput($event)"
>
  <mat-icon>close</mat-icon>
</button>
